name: Control de versiones antes de publicar
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/version*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar versiones y páginas
        run: node --test tests/versiones-compuestas.test.js
