name: Validate Windows desktop app
on:
  workflow_dispatch:
  push:
    paths:
      - "BUILD"
      - "DOINGLIO.bat"
      - "INSTALAR_DOINGLIO.bat"
      - "launcher/**"
      - ".github/workflows/validate-windows-access.yml"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar inicio sin barra ni ventana DOS
        shell: powershell
        run: |
          $launcher=Get-Content "launcher/doinglio_launcher.ps1" -Raw
          $splash=Get-Content "launcher/reloj_inicio.hta" -Raw
          $bat=Get-Content "DOINGLIO.bat" -Raw
          $vbs=Get-Content "launcher/DoingLioInicio.vbs" -Raw
          foreach($flag in @('--app=','--start-fullscreen','--user-data-dir','msedge.exe','chrome.exe')){
            if(!$launcher.Contains($flag)){throw "Falta modo sin barra: $flag"}
          }
          if($launcher.Contains('Start-Process ("http://127.0.0.1:"+$webPort+"/?desktop=1")')){
            throw 'El lanzador sigue abriendo el navegador normal'
          }
          if($splash -notmatch 'BORDER="none"' -or $splash -notmatch 'CAPTION="no"' -or $splash -notmatch 'WINDOWSTATE="maximize"'){
            throw 'Reloj inicial no es pantalla completa sin marco'
          }
          if($vbs -notmatch 'app.Exec\("mshta.exe' -or $vbs -notmatch 'app.Run\(cmd, 0, True\)'){
            throw 'El acceso directo ya no abre el reloj sin DOS'
          }
          if($bat -notmatch 'WindowStyle Hidden'){throw 'El acceso alternativo abre consola visible'}
          Write-Host "Inicio D27: reloj sin marco + navegador modo app fullscreen, pruebas estructurales OK"
      - name: Instalar acceso con cerebro
        shell: powershell
        run: |
          $env:DOINGLIO_CI = "1"
          & ".\INSTALAR_DOINGLIO.bat"
          if($LASTEXITCODE -ne 0){throw "Fallo instalador BAT"}
          $desktop=[Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
          $shortcut=Join-Path $desktop "DoingLio.lnk"
          if(!(Test-Path $shortcut)){throw "No se creo el acceso directo"}
          $shell=New-Object -ComObject WScript.Shell
          $link=$shell.CreateShortcut($shortcut)
          if($link.IconLocation -notmatch "brain-davinci.ico"){throw "Icono cerebral no configurado"}
          if(!(Test-Path "C:\Sistemas\DoingLioLauncher\brain-davinci.ico")){throw "Falta ICO"}
          if(!(Test-Path "C:\Sistemas\DoingLioLauncher\DoingLioInicio.vbs")){throw "Falta VBS"}
          $splash="C:\Sistemas\DoingLioLauncher\reloj_inicio.hta"
          if(!(Test-Path $splash)){throw "Falta reloj de inicio"}
          $hta=Get-Content $splash -Raw
          if($hta -notmatch 'doomsday-clock-bg' -or $hta -notmatch 'DoingLio'){throw "Reloj incompatible"}
          if((Get-Content "C:\Sistemas\DoingLioLauncher\DoingLioInicio.vbs" -Raw) -notmatch 'mshta.exe'){throw "El acceso no abre el reloj"}

          Write-Host "Acceso directo e icono OK"
      - name: Verificar instalador y arrancador de escritorio
        shell: powershell
        run: |
          $env:DOINGLIO_CI = "1"
          & "C:\Sistemas\DoingLioLauncher\DOINGLIO.bat"
          if($LASTEXITCODE -ne 0){throw "Fallo arranque automatico"}
          $paths=@(
            "C:\Sistemas\DoingLioRuntime\index.html",
            "C:\Sistemas\DoingLioRuntime\BUILD",
            "C:\Sistemas\DoingLioRuntime\capitan-rodolfo\index.html",
            "C:\Sistemas\DoingLioRuntime\capitan-rodolfo\VERSION",
            "C:\Sistemas\DoingLioRuntime\ruben\index.html",
            "C:\Sistemas\DoingLioRuntime\ruben\VERSION"
          )
          foreach($path in $paths){if(!(Test-Path $path)){throw "Falta $path"}}
          $installer="C:\Sistemas\DoingLioConnector\sql\PA_CapitanRodolfo_CircuitoEstacion.sql"
          if(!(Test-Path $installer)){throw "El SP no se sincronizo con el conector"}
          if(!(Get-Content $installer -Raw).Contains('ALTER PROCEDURE dbo.PA_CapitanRodolfo_CircuitoEstacion')){
              throw "Archivo del SP incompleto"
          }
          Write-Host "Runtime local y SP de circuito sincronizado OK"
      - name: Validar sintaxis PowerShell y JavaScript
        shell: powershell
        run: |
          $paths=@(
            ".\launcher\instalar_acceso.ps1",
            ".\launcher\doinglio_web_server.ps1",
            ".\launcher\doinglio_launcher.ps1",
            "C:\Sistemas\DoingLioConnector\bridge\capitan_rodolfo_local.ps1"
          )
          foreach($path in $paths){
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Select-Object -First 5|ForEach-Object{Write-Host ("Linea "+$_.Extent.StartLineNumber+" Col "+$_.Extent.StartColumnNumber+": "+$_.Message+" TEXTO: "+$_.Extent.Text)};throw "PowerShell invalido: $path"}
            Write-Host "PowerShell correcto: $path"
          }
          @'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const roots=['C:/Sistemas/DoingLioRuntime/index.html','C:/Sistemas/DoingLioRuntime/capitan-rodolfo/index.html','C:/Sistemas/DoingLioRuntime/capitan-rodolfo/nucleo.html','C:/Sistemas/DoingLioRuntime/capitan-rodolfo/conexion-sql.html','C:/Sistemas/DoingLioRuntime/capitan-rodolfo/mapa-vivo.html'];
          for(const filename of roots){
            const html=fs.readFileSync(filename,'utf8');
            const matches=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            matches.forEach((match,i)=>{
              const script=match[1].trim(); if(!script)return;
              const testFile=path.join(process.env.RUNNER_TEMP,'doinglio-'+path.basename(filename)+'-'+i+'.js');
              fs.writeFileSync(testFile,script);
              cp.execFileSync('node',['--check',testFile],{stdio:'inherit'});
            });
            console.log('JavaScript correcto:',filename);
          }
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\checkjs.cjs"
          & node "$env:RUNNER_TEMP\checkjs.cjs"
          if($LASTEXITCODE -ne 0){throw "JavaScript invalido"}
      - name: Arrancar conector PowerShell real y probar health
        shell: powershell
        run: |
          $bridge="C:\Sistemas\DoingLioConnector\bridge\capitan_rodolfo_local.ps1"
          $app="C:\Sistemas\DoingLioConnector"
          $out=Join-Path $env:RUNNER_TEMP "bridge-real.out.log"
          $err=Join-Path $env:RUNNER_TEMP "bridge-real.err.log"
          $child=Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$bridge,'-AppDir',$app,'-BackgroundChild') -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $found=$null
            for($i=0;$i -lt 40;$i++){
              Start-Sleep -Milliseconds 350
              foreach($p in @(8787,8797,18787,27877,37877,48787,57877)){
                try {
                  $r=Invoke-RestMethod -Uri "http://127.0.0.1:$p/health" -TimeoutSec 1
                  if($r.ok -and $r.service -eq 'Capitan Rodolfo Local'){
                    $found=@{port=$p;health=$r}; break
                  }
                } catch {}
              }
              if($found){break}
            }
            if(-not $found){
              if(Test-Path $out){Get-Content $out -Tail 40}
              if(Test-Path $err){Get-Content $err -Tail 40}
              throw 'El conector real no responde health'
            }
            $expected=(Get-Content (Join-Path $app "VERSION") -Raw).Trim()
            if([string]$found.health.version -ne $expected){throw "Version no coincide: $($found.health.version) != $expected"}
            $state=Invoke-RestMethod -Uri "http://127.0.0.1:$($found.port)/api/state" -TimeoutSec 4
            if($state.connected){throw 'SQL no deberia conectarse en un runner sin instancia'}
            Write-Host "Conector real listo, version $expected, puerto $($found.port), estado SQL sin credenciales correcto"
          } finally {
            Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue
            $pidFile="C:\Sistemas\DoingLio\data\capitan\estado.json"
            if(Test-Path $pidFile){
              try {
                $pidValue=(Get-Content $pidFile -Raw|ConvertFrom-Json).pid
                if($pidValue){Stop-Process -Id ([int]$pidValue) -Force -ErrorAction SilentlyContinue}
              } catch {}
            }
          }
      - name: Probar proxy SQL mismo origen (servidor simulado)
        shell: powershell
        run: |
          $env:DOINGLIO_CI = "1"
          @'
          const http=require('http');
          http.createServer((req,res)=>{
            res.setHeader('Content-Type','application/json');
            if(req.url==='/health'){res.end(JSON.stringify({ok:true,version:process.env.DOINGLIO_TEST_VERSION,apiSqlObject:true,service:'Capitan Rodolfo Local'}));return}
            if(req.url==='/api/connect'){let body='';req.on('data',x=>body+=x);req.on('end',()=>res.end(JSON.stringify({ok:true,echo:JSON.parse(body)})));return}
            res.end(JSON.stringify({ok:true}));
          }).listen(18787,'127.0.0.1');
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\fake_sql.js"
          $expected=(Get-Content "C:\Sistemas\DoingLioRuntime\capitan-rodolfo\VERSION" -Raw).Trim()
          $env:DOINGLIO_TEST_VERSION=$expected
          $fake=Start-Process node.exe -ArgumentList "$env:RUNNER_TEMP\fake_sql.js" -PassThru
          try {
            @{ok=$true;port=18787;version=$expected}|ConvertTo-Json|Set-Content -Encoding UTF8 "C:\Sistemas\DoingLioRuntime\connector.json"
            $server=Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"$PWD\launcher\doinglio_web_server.ps1",'-Root','C:\Sistemas\DoingLioRuntime','-Port','18790') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\server.out.log" -RedirectStandardError "$env:RUNNER_TEMP\server.err.log"
            try {
              $health=$null
              for($i=0;$i -lt 40;$i++){
                Start-Sleep -Milliseconds 300
                try {$health=Invoke-RestMethod 'http://127.0.0.1:18790/_doinglio_health' -TimeoutSec 1;break}catch{}
              }
              if(!$health.ok){Get-Content "$env:RUNNER_TEMP\server.err.log";throw "Servidor local no inicio"}
              $sql=Invoke-RestMethod 'http://127.0.0.1:18790/_doinglio_sql/health'
              if(!$sql.ok -or [string]$sql.version -ne $expected){throw "Proxy GET SQL no responde con versión actual"}
              $post=Invoke-RestMethod 'http://127.0.0.1:18790/_doinglio_sql/api/connect' -Method Post -ContentType 'application/json' -Body '{"server":"DUILIO\\SQLEXPRESS"}'
              if(!$post.ok -or !$post.echo.server){throw "Proxy POST SQL no responde"}
              Write-Host "Proxy GET y POST SQL OK"
            } finally {if($server){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}}
          } finally {if($fake){Stop-Process -Id $fake.Id -Force -ErrorAction SilentlyContinue}}
